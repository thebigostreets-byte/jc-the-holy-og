name: Deploy JC client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jc-pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Determine weekly offline OSM cache key
        id: osmweek
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Nevada OpenStreetMap extract
        uses: actions/cache@v4
        with:
          path: source/.cache/nevada.osm.pbf
          key: vegas-osm-${{ steps.osmweek.outputs.week }}
      - name: Compile 35 km Las Vegas streets and surface parking
        working-directory: source
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check osmium pyproj shapely
          mkdir -p .cache
          if [ ! -s .cache/nevada.osm.pbf ]; then
            curl --fail --location --retry 3 --connect-timeout 25 --max-time 400 \
              https://download.geofabrik.de/north-america/us/nevada-latest.osm.pbf \
              -o .cache/nevada.osm.pbf
          fi
          python scripts/build-osm-pavement.py --pbf .cache/nevada.osm.pbf --out data
          node scripts/register-osm-pavement.mjs
      - name: Display actual road coverage
        working-directory: source
        run: |
          if [ -f data/paving-index.json ]; then
            node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('data/paving-index.json'));console.log('Offline OSM roads:',x.roads.length,'parking:',x.parking.length)"
          else
            echo "::warning::OSM road download/compilation unavailable; retaining existing road fallback. No citywide coverage claim."
          fi
      - name: Validate source before deployment
        working-directory: source
        run: |
          npm ci
          npm run hydrate
          npm run verify:assets
          npm run build
          node scripts/validate-site.mjs
          node scripts/validate-dialogue.mjs
          node scripts/validate-worker.mjs
          node tests/photorealism-pbr.mjs
          node tests/gameplay-regressions.mjs
          node tests/performance-guardrails.mjs
          node tests/npc-motion.mjs
          node tests/npc-autonomy.mjs
          node tests/npc-contacts.mjs
          node tests/npc-memory.mjs
          node tests/systemic-world.mjs
          node tests/living-world-director.mjs

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Sync deployable client
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, readFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          const sourceRoot = 'source';
          const pagesRoot = 'pages';
          const assets = JSON.parse(readFileSync(`${sourceRoot}/scripts/public-assets.json`, 'utf8'));
          let copied = 0;
          for (const asset of assets) {
            const source = `${sourceRoot}/dist/client/${asset}`;
            const target = `${pagesRoot}/${asset}`;
            if (!existsSync(source)) continue;
            const bytes = readFileSync(source);
            if (existsSync(target) && bytes.equals(readFileSync(target))) continue;
            mkdirSync(dirname(target), {recursive: true});
            copyFileSync(source, target);
            copied++;
          }
          for (const file of ['scripts/public-assets.json', '.redeploy-trigger']) {
            const target = `${pagesRoot}/${file}`;
            mkdirSync(dirname(target), {recursive: true});
            copyFileSync(`${sourceRoot}/${file}`, target);
          }
          console.log(`Synchronized ${copied} client assets from main.`);
          NODE
      - name: Rebase root URLs for GitHub project Pages
        run: node source/scripts/rebase-github-pages-paths.mjs pages
      - name: Commit and push deployment bundle
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No client changes to deploy."
            exit 0
          fi
          git commit -m "Deploy JC gameplay bundle from main"
          git push origin gh-pages
