name: Deploy JC static mirror to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore checked game assets
        run: npm run hydrate
      - name: Build the public client
        run: npm run build
      - name: Verify gameplay and asset contracts
        run: |
          npm run verify:assets
          node tests/gameplay-regressions.mjs
          node tests/flight-state.mjs
          node tests/control-upgrade.mjs
          node tests/npc-reactions.mjs
          node tests/performance-guardrails.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy static mirror
        id: deployment
        uses: actions/deploy-pages@v4
