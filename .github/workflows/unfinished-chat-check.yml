name: Unfinished chat integration regression
on:
  push:
    branches: [main, feature/unfinished-chat-changes]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js tests/*.mjs scripts/*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Build and hydrate deployable client before synchronization check
        run: |
          npm ci
          npm run hydrate
          npm run verify:assets
          npm run build
      - name: Check source-to-deploy synchronization
        run: node tests/deployable-client-sync.mjs
      - name: Run regression suite
        run: |
          for file in \
            tests/ability-intensity.mjs \
            tests/audio-controls.mjs \
            tests/flight-state.mjs \
            tests/full-strip-identities.mjs \
            tests/photo-cutout-lod.mjs \
            tests/npc-contacts.mjs \
            tests/npc-memory.mjs \
            tests/control-upgrade.mjs \
            tests/pose-cleanup.mjs \
            tests/character-pose-assets.mjs \
            tests/photorealism-pbr.mjs \
            tests/rooftop-details.mjs \
            tests/predictive-streaming.mjs \
            tests/sin-city-state.mjs \
            tests/vegas-streets.mjs \
            tests/world-time.mjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
