name: City traffic safety regressions
on:
  push:
    branches:
      - fix/city-traffic-integrity-oct10-run9
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source and test syntax
        run: |
          node --check city-traffic.js
          node --check dist/client/city-traffic.js
          node --check tests/city-traffic-safety.mjs
      - name: Check source-deployment parity
        run: cmp city-traffic.js dist/client/city-traffic.js
      - name: Run traffic safety regressions
        run: node tests/city-traffic-safety.mjs
